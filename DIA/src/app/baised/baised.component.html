<div ng-app="myapp">
  <div class="header">
    <a class="apptitlecontainer">Digital Inclusivity Auditor</a>
  </div>
	<div ng-controller="MainCtrl">
    <div>
		     <form ngNoForm class="grid" action="/result" method="POST">
           <div class="form-header">
             <p>Evaluate Your Digital Content</p>
           </div>
           <label>
              URL
              <span style="color: red;">*</span>
            </label>
            <input type="text" [(ngModel)]="name" style="width: auto;" id="urlName" name="urlName" placeholder="Enter the URL here" required>
            <label>
              Model
              <span style="color: red;">*</span>
            </label>
            <select [(ngModel)]="selectedElement" required>
              <ng-container *ngFor="let type of types">
                <option *ngIf="type.id<0" [ngValue]="type.id" disabled>{{type.Name}}</option>
                <option *ngIf="type.id>0" [ngValue]="type.id">{{type.Name}}</option>
              </ng-container>
            </select>
             <div class="panel-footer">
               <div class="pull-right">
                 <input class="btn btn-success float-right" type="Submit" value="Submit"/>
               </div>
               <input (click)="handleClear()" class="btn btn-primary" type="button" value="Reset"/>
             </div>
         </form>
      </div>
    </div>
</div>
